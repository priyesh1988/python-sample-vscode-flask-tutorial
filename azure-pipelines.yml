trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: Deploy
        steps:
          - task: AzureCLI@2
            displayName: 'Create and deploy Web App'
            inputs:
              azureSubscription: 'app'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)
              inlineScript: |
                az group create -n flask-rg -l eastus
                az appservice plan create -n flask-plan -g flask-rg --sku F1 --is-linux
                az webapp create -n flask-123 -g flask-rg -p flask-plan --runtime "PYTHON:3.11"
                az webapp config set -n flask-123 -g flask-rg --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 hello_app.webapp:app"
                cd $(System.DefaultWorkingDirectory)
                zip -r app.zip . -x ".git/*"
                az webapp deploy -n flask-123 -g flask-rg --src-path app.zip --type zip